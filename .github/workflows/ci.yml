name: CI

# Runs on every push to main, on pull requests, and as the gate the Release
# workflow calls before it publishes anything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken runner should not hide the other results.
      fail-fast: false
      matrix:
        # The plugin is plain JavaScript with no dependencies, so it is
        # packaged once; the matrix exists to prove the code and the tests are
        # portable across the platforms DSH ships on, on both supported Node
        # lines.
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        shell: bash
        run: |
          node --check index.js
          node --check client.js

      - name: Test suites
        run: npm test

      - name: Package contents
        shell: bash
        # A tarball that silently lost a file is a bundle that fails to load
        # for whoever installs it.
        run: |
          npm pack --dry-run 2>&1 | tail -20
